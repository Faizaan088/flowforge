# FlowForge Production Docker Compose Overlay / Deployment Configuration
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d

services:
  postgres:
    # In production, never expose database ports to the host network
    ports: !reset []
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Production requires explicit POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Production requires explicit POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Production requires explicit POSTGRES_DB}
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    # In production, never expose Redis ports to the host network
    ports: !reset []
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Production requires explicit REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Production requires explicit REDIS_PASSWORD}
    command: >
      sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD"'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  migration:
    volumes: !reset []  # Use the image contents, not a host bind mount, in production.
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

  api:
    # Reach the API through the frontend reverse proxy, not a published host port.
    ports: !reset []
    restart: always
    volumes: !reset []  # No host volume binds in production
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - FLOWFORGE_SECRET_KEY=${FLOWFORGE_SECRET_KEY:?Production requires explicit FLOWFORGE_SECRET_KEY}
      - FLOWFORGE_ADMIN_USERNAME=${FLOWFORGE_ADMIN_USERNAME:?Production requires explicit FLOWFORGE_ADMIN_USERNAME}
      - FLOWFORGE_ADMIN_PASSWORD=${FLOWFORGE_ADMIN_PASSWORD:?Production requires explicit FLOWFORGE_ADMIN_PASSWORD}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?Production requires explicit CORS_ALLOWED_ORIGINS}
      - REQUIRE_REDIS_AUTH=true
      - FLOWFORGE_TOKEN_EXPIRE_MINUTES=${FLOWFORGE_TOKEN_EXPIRE_MINUTES:-60}
      - SCHEDULER_INTERVAL_SECONDS=${SCHEDULER_INTERVAL_SECONDS:-5.0}
      - EXECUTION_RECOVERY_INTERVAL_SECONDS=${EXECUTION_RECOVERY_INTERVAL_SECONDS:-10.0}
      - EXECUTION_RETRY_BASE_DELAY_SECONDS=${EXECUTION_RETRY_BASE_DELAY_SECONDS:-10.0}
      - RATE_LIMIT_CLEANUP_INTERVAL_SECONDS=${RATE_LIMIT_CLEANUP_INTERVAL_SECONDS:-60.0}
      - RATE_LIMIT_RETENTION_BUFFER_SECONDS=${RATE_LIMIT_RETENTION_BUFFER_SECONDS:-3600.0}
      - LOGIN_RATE_LIMIT_ATTEMPTS=${LOGIN_RATE_LIMIT_ATTEMPTS:-10}
      - LOGIN_RATE_LIMIT_WINDOW_SECONDS=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-900}
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  worker:
    restart: always
    volumes: !reset []  # No host volume binds in production
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REQUIRE_REDIS_AUTH=true
      - LEASE_DURATION_SECONDS=${LEASE_DURATION_SECONDS:-30}
      - HEARTBEAT_INTERVAL_SECONDS=${HEARTBEAT_INTERVAL_SECONDS:-10.0}
      - LEASE_RENEW_INTERVAL_SECONDS=${LEASE_RENEW_INTERVAL_SECONDS:-10.0}
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    restart: always
    ports: !override ["${PROD_HTTP_PORT:-80}:80"]
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
