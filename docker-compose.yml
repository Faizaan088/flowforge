services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    networks:
      - flowforge-backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowforge_user}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided in .env}"
      POSTGRES_DB: ${POSTGRES_DB:-flowforge}
    ports:
      # Bind exclusively to 127.0.0.1 for local tooling; never expose to 0.0.0.0 publicly
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-flowforge_user} -d $${POSTGRES_DB:-flowforge}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - flowforge-backend
    # Development Redis is unauthenticated and bound to loopback on the host.
    # The production overlay enables password authentication.
    command: ["redis-server"]
    ports:
      # Bind exclusively to 127.0.0.1 for local tooling; never expose to 0.0.0.0 publicly
      - "${REDIS_BIND_IP:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    build: .
    networks:
      - flowforge-backend
    command: alembic upgrade head
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-flowforge_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-flowforge}

  api:
    build: .
    restart: unless-stopped
    networks:
      - flowforge-backend
      - flowforge-frontend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    ports:
      - "${API_BIND_IP:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-flowforge_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-flowforge}
      - REDIS_URL=${DOCKER_REDIS_URL:-redis://redis:6379/0}
      - FLOWFORGE_SECRET_KEY=${FLOWFORGE_SECRET_KEY:?FLOWFORGE_SECRET_KEY must be provided in .env}
      - FLOWFORGE_ADMIN_USERNAME=${FLOWFORGE_ADMIN_USERNAME:-admin}
      - FLOWFORGE_ADMIN_PASSWORD=${FLOWFORGE_ADMIN_PASSWORD:?FLOWFORGE_ADMIN_PASSWORD must be provided in .env}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8000}
      - FLOWFORGE_TOKEN_EXPIRE_MINUTES=${FLOWFORGE_TOKEN_EXPIRE_MINUTES:-60}
      - SCHEDULER_INTERVAL_SECONDS=${SCHEDULER_INTERVAL_SECONDS:-5.0}
      - EXECUTION_RECOVERY_INTERVAL_SECONDS=${EXECUTION_RECOVERY_INTERVAL_SECONDS:-10.0}
      - EXECUTION_RETRY_BASE_DELAY_SECONDS=${EXECUTION_RETRY_BASE_DELAY_SECONDS:-10.0}
      - RATE_LIMIT_CLEANUP_INTERVAL_SECONDS=${RATE_LIMIT_CLEANUP_INTERVAL_SECONDS:-60.0}
      - RATE_LIMIT_RETENTION_BUFFER_SECONDS=${RATE_LIMIT_RETENTION_BUFFER_SECONDS:-3600.0}
      - LOGIN_RATE_LIMIT_ATTEMPTS=${LOGIN_RATE_LIMIT_ATTEMPTS:-10}
      - LOGIN_RATE_LIMIT_WINDOW_SECONDS=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-900}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health/ready\")'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build: .
    restart: unless-stopped
    networks:
      - flowforge-backend
    command: python -u worker.py
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-flowforge_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-flowforge}
      - REDIS_URL=${DOCKER_REDIS_URL:-redis://redis:6379/0}
      - LEASE_DURATION_SECONDS=${LEASE_DURATION_SECONDS:-30}
      - HEARTBEAT_INTERVAL_SECONDS=${HEARTBEAT_INTERVAL_SECONDS:-10.0}
      - LEASE_RENEW_INTERVAL_SECONDS=${LEASE_RENEW_INTERVAL_SECONDS:-10.0}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - flowforge-frontend
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy

networks:
  flowforge-backend:
    driver: bridge
  flowforge-frontend:
    driver: bridge

volumes:
  postgres_data: